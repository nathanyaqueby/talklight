<!doctype html>
<!-- Source of img/og-image.png (1200x630). Open via a local server, set the viewport to 1200x630 and screenshot. -->
<meta charset="utf-8">
<link rel="stylesheet" href="../css/app.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0F64B7}
  .og{position:relative;width:1200px;height:630px;display:flex;align-items:center;gap:40px;padding:0 80px;box-sizing:border-box;color:#fff;font-family:var(--font);
    background:radial-gradient(70% 90% at 90% 0,rgba(255,255,255,.28),transparent 60%),linear-gradient(135deg,#0F64B7 15%,#64AAF2 120%)}
  .og::before,.og::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  .og::before{width:620px;height:620px;right:-140px;bottom:-260px}
  .og::after{width:380px;height:380px;right:260px;top:-200px}
  .txt{position:relative;flex:1}
  .txt img{height:84px;display:block;margin-bottom:34px}
  h1{margin:0;font-size:66px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
  p{margin:22px 0 0;font-size:28px;font-weight:600;opacity:.92;max-width:620px;line-height:1.3}
  .chips{display:flex;gap:12px;margin-top:30px}
  .chips span{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.2);font-size:22px;font-weight:700}
  .ph{position:relative;width:260px;height:480px;flex:none;border-radius:44px;background:#fff;padding:12px;box-shadow:0 30px 60px rgba(4,40,90,.35);transform:rotate(4deg)}
  .scr{height:100%;border-radius:34px;background:radial-gradient(120% 70% at 50% 0,#FFEFC7,#fff 70%);display:flex;flex-direction:column;align-items:center;padding-top:34px;gap:14px;color:#0B1B2B}
  .r{position:relative;width:176px;height:176px}
  .r svg{width:100%;height:100%;transform:rotate(-90deg)}
  .r::before{content:"";position:absolute;inset:11%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #DCE6F0}
  .r b{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:#B86E00}
  .pill{padding:6px 16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #DCE6F0;font-weight:800;font-size:17px;color:#B86E00}
  .k{display:flex;gap:8px;margin-top:8px}.k i{width:62px;height:52px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #DCE6F0}
</style>
<div class="og">
  <div class="txt">
    <img src="../img/logo-white.svg" alt="TalkLight">
    <h1>Pause your voice,<br>not your ideas.</h1>
    <p>A silent reminder before your voice gets tired. Try the 60-second demo.</p>
    <div class="chips"><span>No words recorded</span><span>On-device</span><span>EN · DE</span></div>
  </div>
  <div class="ph"><div class="scr">
    <div class="r"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="54" fill="none" stroke="#E6EEF7" stroke-width="11"/><circle cx="66" cy="66" r="54" fill="none" stroke="#F29900" stroke-width="11" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="48"/></svg><b>86%</b></div>
    <div class="pill">Early warning</div>
    <div class="k"><i></i><i></i><i></i></div>
  </div></div>
</div>
